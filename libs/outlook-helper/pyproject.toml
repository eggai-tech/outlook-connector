[project]
name = "outlook-helper"
version = "0.4.0"
description = "A Python library for working with M365 email through the Microsoft Graph API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.27",
    "msal>=1.28",
    "msal-extensions>=1.1",
    "pydantic>=2.6",
    "click>=8.1",
]

[project.scripts]
outlook-helper = "outlook_helper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["outlook_helper"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
