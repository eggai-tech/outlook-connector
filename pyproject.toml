[project]
name = "outlook-connector"
version = "0.1.0"
description = "Bridges a Microsoft 365 mailbox to the EggAI message bus"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "EggAI Technologies" }]
requires-python = ">=3.13"
dependencies = [
    "aiohttp>=3.10",
    "eggai>=0.3.2",
    "outlook-helper>=0.4.0",
    "pydantic-settings[yaml]>=2.0",
    "structlog>=26.1.0",
]

[project.urls]
Repository = "https://github.com/eggai-tech/outlook-connector"
Issues = "https://github.com/eggai-tech/outlook-connector/issues"

[project.scripts]
outlook-connector = "outlook_connector.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# `outlook-helper` lives in-tree at libs/outlook-helper so the two can be
# developed together. It keeps its own pyproject and is installable standalone
# (see README "Consuming outlook-helper elsewhere"). To extract it back into a
# real dependency, drop [tool.uv.workspace], point the source below at its git
# URL, and delete libs/ — no import or source change is needed anywhere.
[tool.uv.workspace]
members = ["libs/*"]

[tool.uv.sources]
outlook-helper = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "fuzz: randomized scenario fuzzing against the simulated mailbox (tests/sim)",
]
